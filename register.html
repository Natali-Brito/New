<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div id="div-master-signup">
    <div id="div-box-signup">
        <h2>Seja bem vindo!</h2>
        <h2>Já tem conta?</h2>
        <p>Realize o login agora mesmo clicando no botão abaixo</p>
        <button id="login" onClick="javascript:window.location.href='/login.html'">Entrar</button>
    </div>
    <div class="container" id="div-form">
        <h2>Cadastre-se</h2>
        <form id="storeForm">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nomeRegister" name="nome" placeholder="Nome" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button id="cadastrar">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#45a049"><path d="m381-240 424-424-57-56-368 367-169-170-57 57 227 226Zm0 113L42-466l169-170 170 170 366-367 172 168-538 538Z"/></svg>                
            </button>
            <button id="cancel" onClick="javascript:window.location.href='/login.html'">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#a04545"><path d="m336-280 144-144 144 144 56-56-144-144 144-144-56-56-144 144-144-144-56 56 144 144-144 144 56 56ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
            </button>
        </form>
    </div>
    </div>
    <script>
        window.onload = function () { 
            document.getElementById('cadastrar').addEventListener('click', function(event){
                event.preventDefault(); // Impede o envio do formulário por padrão
                registrar();
            });
        }
        function registrar() {
            const nome = document.getElementById('nomeRegister').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = "ADMIN";

            fetch('http://localhost:8090/auth/register', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    nome,
                    email,
                    password,
                    username,
                    role
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Erro HTTP! Status: ${response.status}`);
                }
                // Verifica se a resposta tem conteúdo antes de tentar converter para JSON
                return response.text().then(text => text ? JSON.parse(text) : {});
            })
            .then(data => {
                alert('Usuário cadastrado com sucesso!');
                window.location.href="/login.html";
                document.getElementById('storeForm').reset();
                
            })
            .catch(error => console.error('Erro:', error));
        }

    </script>
</body>
</html>
